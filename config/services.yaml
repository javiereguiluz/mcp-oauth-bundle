services:
    _defaults:
        autowire: true
        autoconfigure: true

    Omouren\McpOauthBundle\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/McpOauthBundle.php'
            - '../src/McpOauthSettings.php'
            - '../src/Cimd/CimdException.php'
            - '../src/Cimd/ClientIdMetadataDocument.php'
            - '../src/OAuth/ResourceBoundAccessToken.php'

    Omouren\McpOauthBundle\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    Omouren\McpOauthBundle\Cimd\ClientIdMetadataResolver:
        arguments:
            $cache: '@cache.app'

    Omouren\McpOauthBundle\OAuth\LeagueClientSynchronizer:
        arguments:
            $clientManager: '@?League\Bundle\OAuth2ServerBundle\Manager\ClientManagerInterface'
            $passwordHasher: '@?league.oauth2_server.password_hasher'
